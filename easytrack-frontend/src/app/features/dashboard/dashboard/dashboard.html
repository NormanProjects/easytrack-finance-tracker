<div class="dashboard">
  <!-- Sidebar -->
  <app-sidebar 
    [isOpen]="sidebarOpen"
    [activeView]="activeView"
    (closeSidebar)="toggleSidebar()"
    (viewChange)="changeView($event)"
  ></app-sidebar>

  <!-- Main Content -->
  <div class="dashboard-main" [class.sidebar-open]="sidebarOpen">
    <!-- Header -->
    <app-header 
      [user]="currentUser"
      (toggleSidebar)="toggleSidebar()"
      (logout)="onLogout()"
    ></app-header>

    <!-- Content Area -->
    <div class="dashboard-content">
      <!-- Overview Section -->
      <app-overview *ngIf="activeView === 'overview'"></app-overview>

      <!-- Transactions Section -->
      <div *ngIf="activeView === 'transactions'" class="placeholder-view">
        <svg width="80" height="80" viewBox="0 0 20 20" fill="currentColor" opacity="0.3">
          <path d="M3 4a1 1 0 011-1h12a1 1 0 011 1v2a1 1 0 01-1 1H4a1 1 0 01-1-1V4zM3 10a1 1 0 011-1h6a1 1 0 011 1v6a1 1 0 01-1 1H4a1 1 0 01-1-1v-6zM14 9a1 1 0 00-1 1v6a1 1 0 001 1h2a1 1 0 001-1v-6a1 1 0 00-1-1h-2z"/>
        </svg>
        <h2>Transactions</h2>
        <p>Track all your income and expenses in one place</p>
        <small style="color: #64748B; margin-top: 1rem;">Coming soon...</small>
      </div>

      <!-- Budget Section -->
      <app-budget *ngIf="activeView === 'budget'"></app-budget>

      <!-- Analytics Section -->
      <div *ngIf="activeView === 'analytics'" class="placeholder-view">
        <svg width="80" height="80" viewBox="0 0 20 20" fill="currentColor" opacity="0.3">
          <path d="M2 11a1 1 0 011-1h2a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zM8 7a1 1 0 011-1h2a1 1 0 011 1v9a1 1 0 01-1 1H9a1 1 0 01-1-1V7zM14 4a1 1 0 011-1h2a1 1 0 011 1v12a1 1 0 01-1 1h-2a1 1 0 01-1-1V4z"/>
        </svg>
        <h2>Analytics</h2>
        <p>Visualize your financial data with detailed charts and insights</p>
        <small style="color: #64748B; margin-top: 1rem;">Coming soon...</small>
      </div>

      <!-- Settings Section -->
      <div *ngIf="activeView === 'settings'" class="placeholder-view">
        <svg width="80" height="80" viewBox="0 0 20 20" fill="currentColor" opacity="0.3">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
        <h2>Settings</h2>
        <p>Manage your account preferences and app settings</p>
        <small style="color: #64748B; margin-top: 1rem;">Coming soon...</small>
      </div>
    </div>
  </div>
</div>
