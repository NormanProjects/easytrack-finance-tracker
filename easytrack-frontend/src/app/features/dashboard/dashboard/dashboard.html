<div class="dashboard">
  <!-- Sidebar -->
  <app-sidebar 
    [isOpen]="sidebarOpen"
    [activeView]="activeView"
    (closeSidebar)="toggleSidebar()"
    (viewChange)="changeView($event)"
  ></app-sidebar>

  <!-- Main Content -->
  <div class="dashboard-main" [class.sidebar-open]="sidebarOpen">
    <!-- Header -->
    <app-header 
      [user]="currentUser"
      (toggleSidebar)="toggleSidebar()"
      (logout)="onLogout()"
    ></app-header>

    <!-- Content Area -->
    <div class="dashboard-content">
      <!-- Overview Section -->
      <app-overview *ngIf="activeView === 'overview'"></app-overview>

      <!-- Transactions Section -->
      <app-transactions *ngIf="activeView === 'transactions'"></app-transactions>

      <!-- Budget Section -->
      <app-budget *ngIf="activeView === 'budget'"></app-budget>


      <!-- Accounts Section -->
      <app-account-list *ngIf="activeView === 'accounts'"></app-account-list>

      <!-- Analytics Section -->
      <app-analytics *ngIf="activeView === 'analytics'"></app-analytics>

      <!-- Settings Section -->
        <app-settings *ngIf="activeView === 'settings'"></app-settings>
    </div>
  </div>
</div>
